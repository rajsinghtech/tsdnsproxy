apiVersion: v1
kind: Namespace
metadata:
  name: tsdnsproxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
rules:
# get, update, and patch the named state Secret from TSDNSPROXY_STATE.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["tsdnsproxy-state"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: v1
kind: Secret
metadata:
  name: tsdnsproxy-state
  namespace: tsdnsproxy
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsdnsproxy
subjects:
- kind: ServiceAccount
  name: tsdnsproxy
  namespace: tsdnsproxy
---
# Rules applied to every client. Same shape as one grant value.
# An ACL grant for the same domain wins unless TSDNSPROXY_RULES_ONLY=true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsdnsproxy-rules
  namespace: tsdnsproxy
data:
  rules.json: |
    {
      "example.internal": {
        "dns": ["10.0.0.53:53"],
        "translateid": 1,
        "allowips": ["10.0.0.0/8"]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
  labels:
    app: tsdnsproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsdnsproxy
  template:
    metadata:
      labels:
        app: tsdnsproxy
    spec:
      serviceAccountName: tsdnsproxy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tsdnsproxy
        image: ghcr.io/rajsinghtech/tsdnsproxy:1.1.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        - containerPort: 8080
          protocol: TCP
          name: health
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TSDNSPROXY_STATE
          value: "kube:tsdnsproxy-state"
        - name: TSDNSPROXY_HOSTNAME
          value: "$(POD_NAME)"
        - name: TSDNSPROXY_LOG_LEVEL
          value: info
        - name: TSDNSPROXY_HTTP_ADDR
          value: ":8080"
        - name: TSDNSPROXY_STATE_DIR
          value: /tmp/tsdnsproxy
        - name: TSDNSPROXY_LISTEN_ADDRS
          value: tailscale
        - name: TSDNSPROXY_SERVICE
          value: svc:dns
        - name: TSDNSPROXY_ADVERTISE_TAGS
          value: tag:tsdnsproxy
        # Set this to the capability name in your ACL grants.
        - name: TSDNSPROXY_CAP_NAME
          value: example.com/cap/dns
        - name: TSDNSPROXY_RULES_FILE
          value: /etc/tsdnsproxy/rules.json
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tsdnsproxy-auth
              key: TS_AUTHKEY_EPHEMERAL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: rules
          mountPath: /etc/tsdnsproxy
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: rules
        configMap:
          name: tsdnsproxy-rules
      - name: tmp
        emptyDir: {}
