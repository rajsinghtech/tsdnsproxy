# Several replicas, one Tailscale Service VIP.
# Apply this file instead of k8s/deployment.yaml. Do not apply both:
# they share the tsdnsproxy Role name.
#
# Policy, in the tailnet ACL:
#   tagOwners.tag:tsdnsproxy owns the tag.
#   autoApprovers.services.svc:dns includes tag:tsdnsproxy.
#   a grant lets clients reach dst svc:dns port 53.
# In the admin console, define service svc:dns with endpoint tcp:53.
# The auth key must be reusable and tagged tag:tsdnsproxy.
#
# A Deployment's pod names are not known ahead of time, so a Role cannot
# list the state Secrets. This StatefulSet uses fixed names
# tsdnsproxy-0 and tsdnsproxy-1.
apiVersion: v1
kind: Namespace
metadata:
  name: tsdnsproxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - tsdnsproxy-state-tsdnsproxy-0
  - tsdnsproxy-state-tsdnsproxy-1
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: v1
kind: Secret
metadata:
  name: tsdnsproxy-state-tsdnsproxy-0
  namespace: tsdnsproxy
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: tsdnsproxy-state-tsdnsproxy-1
  namespace: tsdnsproxy
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsdnsproxy
subjects:
- kind: ServiceAccount
  name: tsdnsproxy
  namespace: tsdnsproxy
---
# Required by the StatefulSet. Tailscale clients do not use this Service.
# They use svc:dns (TCP 53) and each pod's own Tailscale address (UDP 53).
apiVersion: v1
kind: Service
metadata:
  name: tsdnsproxy-pods
  namespace: tsdnsproxy
spec:
  clusterIP: None
  selector:
    app: tsdnsproxy
  ports:
  - port: 8080
    name: health
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tsdnsproxy
  namespace: tsdnsproxy
spec:
  serviceName: tsdnsproxy-pods
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tsdnsproxy
  template:
    metadata:
      labels:
        app: tsdnsproxy
    spec:
      serviceAccountName: tsdnsproxy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tsdnsproxy
        image: ghcr.io/rajsinghtech/tsdnsproxy:1.1.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        - containerPort: 8080
          protocol: TCP
          name: health
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TSDNSPROXY_SERVICE
          value: svc:dns
        - name: TSDNSPROXY_ADVERTISE_TAGS
          value: tag:tsdnsproxy
        - name: TSDNSPROXY_LISTEN_ADDRS
          value: tailscale
        - name: TSDNSPROXY_HOSTNAME
          value: $(POD_NAME)
        - name: TSDNSPROXY_STATE
          value: kube:tsdnsproxy-state-$(POD_NAME)
        - name: TSDNSPROXY_LOG_LEVEL
          value: info
        - name: TSDNSPROXY_HTTP_ADDR
          value: ":8080"
        - name: TSDNSPROXY_STATE_DIR
          value: /tmp/tsdnsproxy
        - name: TSDNSPROXY_CAP_NAME
          value: example.com/cap/dns
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tsdnsproxy-auth
              key: TS_AUTHKEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
